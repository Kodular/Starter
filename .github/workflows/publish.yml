name: publish

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os_name: linux
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - platform: windows-latest
            os_name: windows
            target: x86_64-pc-windows-msvc
            formats: nsis
          - platform: macos-latest # Apple Silicon
            os_name: macos (ARM)
            target: aarch64-apple-darwin
            formats: dmg
          - platform: macos-latest # Intel
            os_name: macos (Intel)
            target: x86_64-apple-darwin
            formats: dmg

    name: Building for ${{ matrix.os_name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev libusb-1.0-0-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: install cargo-packager
        run: cargo install cargo-packager --locked

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: package
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: starter-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: read version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Kodular Starter v${{ steps.version.outputs.version }}
          body: See the assets to download this version and install.
          draft: true
          files: dist/*
